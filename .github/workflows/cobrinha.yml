name: Generate Datas

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Stats card (inclui contribuições privadas)
      - name: Generate stats card
        run: python3 .github/scripts/stats.py
        env:
          STATS_USER: charlesheusser
          STATS_OUT: dist/stats.svg
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # Snake Animation
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: charlesheusser
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#1f6feb
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#58a6ff

      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
