name: Generate Datas

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Jobs to update datas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Snake Animation
      - uses: Platane/snk@master
        id: snake-gif
        with:
          github_user_name: charlesheusser
          svg_out_path: dist/github-contribution-grid-snake.svg

      # Stats card (inclui contribuições privadas)
      - name: Generate stats card
        run: python3 .github/scripts/stats.py
        env:
          STATS_USER: charlesheusser
          STATS_OUT: dist/stats.svg
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
